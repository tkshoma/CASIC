<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASIC Tester</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="workspace">
        <!-- 左カラム：Code（縦いっぱい）＋ 下部サジェストバー -->
        <div class="code-column">
            <div class="pane-header">
                <h3>Code <span style="font-size:12px; font-weight:normal; color:#888;">(行番号クリックでその行だけ実行)</span></h3>
                <span id="code-stats" class="stats">Lines: 0 | Length: 0 | Pos: 0</span>
            </div>
            <div id="code-container" class="editor-container">
                <div id="line-numbers" class="line-numbers"></div>
                <div class="editor-body">
                    <div id="code-highlight" class="highlight-layer"></div>
                    <textarea id="code" class="code-textarea" spellcheck="false" placeholder="ここにCASICのコードを書く..."></textarea>
                </div>
            </div>
            <!-- 予測変換（サジェストバー） -->
            <div id="suggest-bar" class="suggest-bar">
                <span class="suggest-placeholder">予測変換: 文字を入力すると候補が表示されます (Tabで選択 / Tab+数字で直接指定)</span>
            </div>
        </div>

        <!-- 中央カラム：1.コマンドライン / 2.実行1・実行2 / 3.入力・出力 / 4.ボタン群 -->
        <div class="center-column">
            <!-- 1段目：コマンドライン -->
            <div class="cmdline-section">
                <div class="pane-header">
                    <h3>コマンドライン</h3>
                    <div class="header-actions">
                        <span id="exec-stats" class="stats">Next: 1 | InPtr: 0 | Steps: 0</span>
                        <button class="small-tool-btn" onclick="clearCmdlineLog()" title="ログをクリア">クリア</button>
                        <button class="small-tool-btn" onclick="openPopupWindow('cmdline')" title="コマンドラインを別ウィンドウで開く">別窓</button>
                    </div>
                </div>
                <div id="cmdline-log" class="cmdline-log"></div>
                <div class="cmdline-input-row">
                    <textarea id="cmdline-input" class="cmdline-input" spellcheck="false" placeholder="cont, run 2:3, goto 2, step 2... (Ctrl+Enterで実行)"></textarea>
                    <button class="cmdline-run-btn" onclick="runCommandLineFromMain()">実行</button>
                </div>
            </div>

            <!-- 2段目：実行1 ＆ 実行2 -->
            <div class="sub-editors-row">
                <div class="sub-box" id="box-sub1">
                    <div class="pane-header">
                        <h3>実行1</h3>
                        <button class="small-tool-btn run-mini-btn" onclick="runSub(1)">▶ 実行</button>
                    </div>
                    <div id="sub-code1-container" class="editor-container sub-editor-container">
                        <div class="editor-body">
                            <div id="sub-code1-highlight" class="highlight-layer"></div>
                            <textarea id="sub-code1" class="code-textarea" spellcheck="false" placeholder="追加コード1..."></textarea>
                        </div>
                    </div>
                </div>
                <div class="sub-box" id="box-sub2">
                    <div class="pane-header">
                        <h3>実行2</h3>
                        <button class="small-tool-btn run-mini-btn" onclick="runSub(2)">▶ 実行</button>
                    </div>
                    <div id="sub-code2-container" class="editor-container sub-editor-container">
                        <div class="editor-body">
                            <div id="sub-code2-highlight" class="highlight-layer"></div>
                            <textarea id="sub-code2" class="code-textarea" spellcheck="false" placeholder="追加コード2..."></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 3段目：入力 ＆ 出力 -->
            <div class="io-row">
                <div class="io-box">
                    <div class="pane-header">
                        <h3>入力</h3>
                        <div class="header-actions">
                            <button class="small-tool-btn" onclick="openPopupWindow('input')" title="入力を別ウィンドウで開く">別窓</button>
                        </div>
                    </div>
                    <textarea id="input-data" spellcheck="false" placeholder="入力データ..."></textarea>
                </div>
                <div class="io-box">
                    <div class="pane-header">
                        <h3>出力</h3>
                        <div class="header-actions">
                            <button class="small-tool-btn" onclick="clearOutputOnly()" title="出力をクリア">クリア</button>
                            <button class="small-tool-btn" onclick="openPopupWindow('output')" title="出力を別ウィンドウで開く">別窓</button>
                        </div>
                    </div>
                    <div id="output" class="output-area"></div>
                </div>
            </div>

            <!-- 4段目：ボタン群 -->
            <div class="button-cluster">
                <div class="button-cluster-row">
                    <button onclick="runMain()">RUN</button>
                    <button class="step-btn" onclick="stepMain()">ステップ</button>
                    <button class="init-btn" onclick="resetEngine()">初期化</button>
                </div>
                <div class="button-cluster-row">
                    <button class="sub-btn" onclick="runSub(1)">実行1</button>
                    <button class="sub-btn" onclick="runSub(2)">実行2</button>
                    <button class="settings-btn" onclick="openSettingsModal()">設定</button>
                </div>
            </div>
        </div>

        <!-- 右カラム：メモリ（縦いっぱい） -->
        <div class="memory-column">
            <div class="memory-header">
                <div class="memory-header-top">
                    <div style="font-size: 14px; color: #bbb; font-weight: bold;">メモリ</div>
                    <div class="header-actions">
                        <button class="small-tool-btn" onclick="openPopupWindow('memory')" title="メモリを別ウィンドウで開く">別窓</button>
                    </div>
                </div>
                <div class="memory-inputs">
                    <input type="text" id="manual-mem-name" placeholder="名前 (a, b[])" title="変数名または配列名">
                    <input type="text" id="manual-mem-val" placeholder="値 (12, [a,b])" title="設定する値">
                    <button class="set-mem-btn" onclick="setManualMemory()">SET</button>
                </div>
            </div>
            <div id="memory" class="memory-container">
                <div class="memory-empty">メモリは空です</div>
            </div>
        </div>
    </div>

    <!-- 設定モーダル -->
    <div id="settings-modal" class="modal-overlay hidden" onclick="handleModalOverlayClick(event)">
        <div class="modal-box">
            <div class="modal-header">
                <h3>エディタ設定</h3>
                <button class="modal-close-btn" onclick="closeSettingsModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="setting-item">
                    <label for="setting-tab-spaces">Tabキーのインデントスペース数</label>
                    <input type="number" id="setting-tab-spaces" min="1" max="16" value="4">
                </div>
                <div class="setting-item">
                    <label for="setting-auto-indent">改行時の自動インデント</label>
                    <input type="checkbox" id="setting-auto-indent" checked>
                </div>
                <div class="setting-item">
                    <label for="setting-auto-paren">「(」入力時の自動閉じ括弧「)」</label>
                    <input type="checkbox" id="setting-auto-paren" checked>
                </div>
                <div class="setting-item">
                    <label for="setting-auto-quote">「"」入力時の自動閉じクォート「"」</label>
                    <input type="checkbox" id="setting-auto-quote" checked>
                </div>
            </div>
            <div class="modal-footer">
                <span class="setting-save-note">※設定は自動的にブラウザへ保存されます</span>
                <button class="modal-ok-btn" onclick="closeSettingsModal()">閉じる</button>
            </div>
        </div>
    </div>

    <script src="casic-core.js"></script>
    <script src="casic-math.js"></script>
    <script src="casic-expr.js"></script>
    <script src="casic-funcs.js"></script>
    <script src="casic-cmd.js"></script>
    <script src="casic-engine.js"></script>
    <script src="casic-popup.js"></script>
    <script src="casic-ui.js"></script>
</body>
</html>
